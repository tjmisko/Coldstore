name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -tags e2e -count=1 -timeout 120s ./tests/e2e/...

  e2e-live:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          mkdir -p internal/api/dist
          touch internal/api/dist/index.html
          go build -o coldstore ./cmd/coldstore
      - name: Start services
        run: docker compose -f docker/compose.test.yml up -d --build --wait
      - name: Run live e2e tests
        run: go test -tags e2e,e2e_live -count=1 -timeout 300s ./tests/e2e/...
      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.test.yml down -v
